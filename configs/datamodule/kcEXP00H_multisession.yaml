_target_: lfads_torch.datamodules.BasicDataModule
datafile_pattern: ${relpath:datasets/kcEXP00H_multisession/lfads_*.h5}
# 14 train / 4 valid trials per fly across 5 sessions. BasicDataModule divides
# this by n_sessions (=5) for the per-session DataLoader, and the train loader
# uses drop_last=True -- so per-session batch (batch_size/5) must be <= 14 or the
# only batch gets dropped and training silently does nothing. 70/5 = 14 keeps one
# full batch per session (all trials).
batch_size: 70
